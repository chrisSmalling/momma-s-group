name: Phase 1 UI Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to audit
        required: false
        default: https://mommas-group.vercel.app
        type: string

jobs:
  browserbase-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser audit dependencies
        run: npm install --no-save @browserbasehq/sdk playwright-core

      - name: Run read-only production UI audit
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          QA_BASE_URL: ${{ inputs.base_url }}
        run: node qa/browserbase-phase1-readonly.mjs
