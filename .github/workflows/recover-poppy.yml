name: Recover Poppy Patch

on:
  push:
    branches:
      - feat/poppy-server-recommendations

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Claude Poppy patch onto main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show HEAD:poppy-recovery.patch > /tmp/poppy-recovery.patch
          git reset --hard origin/main
          git apply --3way --check /tmp/poppy-recovery.patch
          git apply --3way /tmp/poppy-recovery.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(poppy): recover full server recommendation implementation'
          git push --force origin HEAD:feat/poppy-server-recommendations

# One-shot recovery workflow; the successful commit supersedes this helper.
