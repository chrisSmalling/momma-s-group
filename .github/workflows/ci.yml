name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Require schema snapshot with migrations
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD -- 'supabase/migrations/**' | grep -q .; then
            if ! git diff --name-only "$base"...HEAD -- 'db/schema-snapshot.sql' | grep -q '^db/schema-snapshot.sql$'; then
              echo 'Migration changes detected without a db/schema-snapshot.sql update.'
              exit 1
            fi
          fi
