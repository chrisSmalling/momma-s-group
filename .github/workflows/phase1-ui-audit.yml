name: Phase 1 UI Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to audit
        required: true
        default: https://mommas-group.vercel.app
        type: string

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install audit browser client
        run: npm install --no-save --no-package-lock playwright@latest

      - name: Verify Browserbase credential
        run: |
          if [ -z "$BROWSERBASE_API_KEY" ]; then
            echo "BROWSERBASE_API_KEY GitHub Actions secret is missing."
            exit 1
          fi

      - name: Run Phase 1 UI audit
        run: node scripts/phase1-ui-audit.mjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-ui-audit
          path: test-results/
          if-no-files-found: warn
